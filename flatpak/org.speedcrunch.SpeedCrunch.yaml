app-id: org.speedcrunch.SpeedCrunch
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: speedcrunch

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

modules:
  - name: speedcrunch
    buildsystem: cmake-ninja
    subdir: src
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: dir
        path: ../speedcrunch
      - type: patch
        path: github-light-case.patch
