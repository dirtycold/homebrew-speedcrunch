app-id: org.speedcrunch.SpeedCrunch
branch: upstream
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: speedcrunch

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

modules:
  - name: speedcrunch
    buildsystem: cmake-ninja
    subdir: src
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/heldercorreia/speedcrunch.git
        tag: v1.1.0
        commit: e7ca37fbf066162cece0ecf43d4ddc6ca1eb195d
